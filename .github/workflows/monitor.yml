name: Monitor Timepiece Tickets

# The schedule trigger has been removed: production monitoring now runs
# continuously on a VPS under PM2 (see README.md, "Deploying to a Linux
# VPS"). This workflow is kept only for manual/dev testing via
# workflow_dispatch. Do NOT re-add a `schedule:` trigger here while the
# VPS is also running src/monitor.js, or FIXR will be polled from both
# places at once and the two state files can disagree.
on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: fixr-timepiece-state-${{ github.run_id }}
          restore-keys: |
            fixr-timepiece-state-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tickets
        env:
          EVENT_URL: ${{ vars.EVENT_URL || 'https://fixr.co/organiser/timepiece' }}
          EVENT_DATA_URL: ${{ vars.EVENT_DATA_URL || 'https://fixr.co/_next/data/f560c3d2/organiser/timepiece.json' }}
          STATE_FILE: .monitor-state/state.json
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        # NOTE: this runs `npm run check` (the one-shot script), not
        # `npm start`. `npm start` now launches the continuous VPS
        # monitor loop (src/monitor.js), which never exits — running
        # that here would just hang until timeout-minutes kills the job.
        run: npm run check

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: fixr-timepiece-state-${{ github.run_id }}